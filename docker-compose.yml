services:
  postgres:
    image: postgres:16-alpine
    container_name: armor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-armor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-armor_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-armor_marketing}
    ports:
      - "5432:5432"
    volumes:
      - armor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-armor} -d ${POSTGRES_DB:-armor_marketing}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  armor_pgdata:
